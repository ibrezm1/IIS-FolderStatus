<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Monitor - Last Modified Date</title>

    <!-- Online CSS from Web (Google Fonts, Bootstrap 5, Font Awesome) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Separate Local CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="container main-container my-auto py-5">
        <div class="text-center mb-4">
            <span class="header-badge mb-2">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="badgeStatusText">Checking...</span>
            </span>
            <h1 class="h3 fw-bold text-dark mt-2">Folder Monitor</h1>
            <p class="text-secondary mb-0">Live directory tracking & timestamp inspector</p>
        </div>

        <div class="card monitor-card">
            <div class="card-header-bar"></div>
            <div class="card-body p-4 p-md-5">

                <!-- Folder Path Section -->
                <div class="mb-4">
                    <div class="info-label">
                        <i class="fa-solid fa-folder me-1 text-primary"></i> Target Folder
                    </div>
                    <div class="d-flex align-items-center folder-box justify-content-between">
                        <span id="folderPath" class="text-muted">Loading folder path...</span>
                        <button id="copyBtn" class="btn btn-sm btn-outline-secondary border-0 copy-btn ms-2" title="Copy to clipboard">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>

                <!-- Last Modified & Status Section -->
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <div class="p-3 border rounded-3 bg-light">
                            <div class="info-label">
                                <i class="fa-regular fa-clock me-1 text-primary"></i> Last Modified
                            </div>
                            <div id="lastModified" class="fs-5 fw-semibold text-dark">
                                <span class="spinner-border spinner-border-sm text-secondary me-1" role="status"></span>
                                Loading...
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 border rounded-3 bg-light">
                            <div class="info-label">
                                <i class="fa-solid fa-circle-info me-1 text-primary"></i> Status
                            </div>
                            <div id="statusBox" class="fs-5 fw-semibold text-secondary d-flex align-items-center gap-2">
                                <span id="statusText">Checking...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action & Info Section -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center pt-2 gap-3">
                    <span class="text-muted small">
                        Last checked: <span id="lastChecked" class="fw-medium text-dark">--:--:--</span>
                    </span>
                    <button id="refreshBtn" class="btn btn-primary px-4 py-2 rounded-pill fw-medium shadow-sm">
                        <i class="fa-solid fa-arrows-rotate me-2"></i>Refresh Status
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Online JS from Web (Bootstrap 5 Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Separate Local JS -->
    <script src="/js/app.js"></script>
</body>
</html>
